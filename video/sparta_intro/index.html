<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="pp">▶︎ / ❚❚</button><input id="sc" type="range" min="0" max="41.4" step="0.0166667" value="0"><span id="tm">0.00</span></div>
<audio id="au" src="audio/mix.wav" preload="auto"></audio>
<script>
'use strict';
/* =====================================================================
   Спарта — вступление. Детерминированный таймлайн: renderAt(t).
   2.5D-камера: масштаб слоя = F/(d - cam.z) → настоящий параллакс.
   ===================================================================== */
const W = 1920, H = 1080, FPS = 60, DUR = 41.4, F = 1000;
const SUB = 3, SHUTTER = 0.5;           // motion blur: 3 подкадра, затвор 180°
const P = {
  bg:  [238,228,210], ink: [31,37,51], red: [200,64,43],
  och: [217,154,62],  sl:  [94,113,134]
};
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const rng = (t, a, b) => clamp((t - a) / (b - a));
const hr = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const E = {
  lin: t => t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  s: t => -(Math.cos(Math.PI * t) - 1) / 2,
  o: t => 1 - Math.pow(1 - t, 3),
  o5: t => 1 - Math.pow(1 - t, 5),
  i: t => t * t * t,
  i2: t => t * t,
  ob: t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
/* Сплайн Эрмита (Catmull-Rom по времени): непрерывная скорость, без остановок на ключах */
function spl(t, k) {
  const n = k.length;
  if (t <= k[0][0]) return k[0][1];
  if (t >= k[n - 1][0]) return k[n - 1][1];
  let i = 0; while (t > k[i + 1][0]) i++;
  const [t0, v0] = k[i], [t1, v1] = k[i + 1];
  const m = j => (j <= 0 || j >= n - 1) ? 0 : (k[j + 1][1] - k[j - 1][1]) / (k[j + 1][0] - k[j - 1][0]);
  const h = t1 - t0, u = (t - t0) / h;
  const u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * v0 + (u3 - 2 * u2 + u) * h * m(i) + (-2 * u3 + 3 * u2) * v1 + (u3 - u2) * h * m(i + 1);
}
const camOf = (K, t) => ({ x: spl(t, K.x), y: spl(t, K.y), z: spl(t, K.z), rot: spl(t, K.r), f: K.f || 1000, dof: K.dof || 9 });

/* ---------- холсты ---------- */
const cv = document.getElementById('c'), main = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const frC = mk(), fr = frC.getContext('2d');
const s1C = mk(), s1 = s1C.getContext('2d');
const s2C = mk(), s2 = s2C.getContext('2d');
const offC = mk(), og = offC.getContext('2d');
let G = fr;

function proj(g, cam, d) {
  const s = F / (d - cam.z);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.translate(W / 2, H / 2); g.rotate(cam.rot); g.scale(s, s); g.translate(-cam.x, -cam.y);
  return s;
}
function toScreen(cam, d, X, Y) {
  const s = F / (d - cam.z), x = (X - cam.x) * s, y = (Y - cam.y) * s;
  const c = Math.cos(cam.rot), sn = Math.sin(cam.rot);
  return [W / 2 + x * c - y * sn, H / 2 + x * sn + y * c];
}
function polyClip(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.clip(); }
/* Слой глубины d: DOF-размытие от расстояния до фокуса, опц. альфа и экранная маска */
function layer(cam, d, fn, opt = {}) {
  const dz = d - cam.z; if (dz < 30) return;
  const s = F / dz;
  let b = opt.blur != null ? opt.blur : Math.min(18, Math.abs(F / dz - F / (cam.f - cam.z)) * cam.dof);
  b += opt.addBlur || 0;
  const a = opt.alpha == null ? 1 : opt.alpha;
  if (a <= 0.002) return;
  if (b < 0.6 && a >= 1) {
    G.save();
    if (opt.clip) { G.setTransform(1, 0, 0, 1, 0, 0); polyClip(G, opt.clip); }
    proj(G, cam, d); fn(G, s); G.restore(); return;
  }
  og.setTransform(1, 0, 0, 1, 0, 0); og.clearRect(0, 0, W, H);
  og.save(); proj(og, cam, d); fn(og, s); og.restore();
  G.save(); G.setTransform(1, 0, 0, 1, 0, 0);
  if (opt.clip) polyClip(G, opt.clip);
  if (b >= 0.6) G.filter = `blur(${b.toFixed(2)}px)`;
  G.globalAlpha = a; G.drawImage(offC, 0, 0); G.restore();
}
function shadow(g, s, k = 1, a = 0.16) {
  g.shadowColor = rgb(P.ink, a); g.shadowBlur = 26 * k; g.shadowOffsetX = 0; g.shadowOffsetY = 10 * k;
}
function noShadow(g) { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; }
function circ(g, x, y, r, c) { if (r <= 0) return; g.fillStyle = rgb(c); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function rect(g, x, y, w, h, c) { g.fillStyle = rgb(c); g.fillRect(x, y, w, h); }
function poly(g, pts, c) { g.fillStyle = rgb(c); g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); }
function line(g, x1, y1, x2, y2, w, c, cap = 'round') { g.strokeStyle = rgb(c); g.lineWidth = w; g.lineCap = cap; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function roundPoly(g, pts, rads) {
  const n = pts.length; g.beginPath();
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const st = mid(pts[n - 1], pts[0]); g.moveTo(st[0], st[1]);
  for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; g.arcTo(p[0], p[1], q[0], q[1], rads[i]); }
  g.closePath();
}
/* Каменный фриз: цвет уходит в охро-чернильную монохромию */
const STA = mix(P.ink, P.och, 0.5);
function stone(c, f) {
  if (f <= 0) return c;
  const L = (0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]) / 255;
  return mix(c, mix(STA, P.bg, clamp((L - 0.1) / 0.85)), f);
}

/* =====================================================================
   ТИПОГРАФИКА
   ===================================================================== */
const FONTS = { O7: (s) => `700 ${s}px Oswald`, O4: (s) => `400 ${s}px Oswald`, P9: (s) => `900 ${s}px "Playfair Display"`, Pi: (s) => `italic 700 ${s}px "Playfair Display"` };
const mcache = {};
function charXs(str, f, size, track) {
  const key = str + '|' + f + '|' + size + '|' + track;
  if (mcache[key]) return mcache[key];
  fr.save(); fr.font = FONTS[f](size);
  const xs = [], ws = [];
  for (let i = 0; i < str.length; i++) {
    xs.push(fr.measureText(str.slice(0, i)).width + i * track * size);
    ws.push(fr.measureText(str[i]).width);
  }
  const total = fr.measureText(str).width + (str.length - 1) * track * size;
  fr.restore();
  return (mcache[key] = { xs, ws, total });
}
const textW = (str, f, size, track = 0) => charXs(str, f, size, track).total;

function drawText(it, t, cam) {
  const din = it.din || 0.7, dout = it.dout || 0.45;
  if (t < it.t0 || t > it.t1 + dout + (it.fout === 'fall' ? 1.4 : 0)) return;
  const p = rng(t, it.t0, it.t0 + din), q = rng(t, it.t1, it.t1 + dout);
  const g = G; g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  const drift = (it.vx == null ? -9 : it.vx) * (t - it.t0);
  g.translate(W / 2, H / 2); g.rotate((cam ? cam.rot : 0) * 0.45); g.translate(-W / 2 + drift, -H / 2);
  if (it.shake) { const [sx, sy] = it.shake(t); g.translate(sx, sy); }
  let x = it.x, y = it.y, size = it.size;
  if (it.move) {
    const m = it.move, u = E.io(rng(t, m.t0, m.t1));
    x = lerp(x, m.x, u); y = lerp(y, m.y, u); size = lerp(size, size * m.sc, u);
  }
  let track = it.track || 0;
  if (it.trackTo != null) track = lerp(track, it.trackTo, E.s(rng(t, it.t0, it.t1 + dout)));
  const fin = it.fin || 'up', fout = it.fout || 'up';
  const M = charXs(it.s, it.f, size, track);
  const n = it.s.length, spread = it.spread == null ? 0.35 : it.spread;
  let x0 = it.al === 'c' ? x - M.total / 2 : it.al === 'r' ? x - M.total : x;
  if (fin === 'track' && p < 1) { /* разрядка сжимается к центру */ }
  let col = typeof it.col === 'function' ? it.col(t) : it.col;
  let A = it.alpha == null ? 1 : it.alpha;
  if (it.dim) A *= lerp(1, it.dim.a, E.io(rng(t, it.dim.t, it.dim.t + 0.4)));
  g.font = FONTS[it.f](size); g.textBaseline = 'alphabetic';
  const needClip = (fin === 'up' && p < 1) || (fout === 'up' && q > 0);
  if (needClip) { g.beginPath(); g.rect(x0 - size, y - size * 1.02, M.total + size * 2, size * 1.3); g.clip(); }
  const sh = it.noShadow ? 0 : 1;
  for (let i = 0; i < n; i++) {
    const ch = it.s[i]; if (ch === ' ') continue;
    const off = n > 1 ? spread * i / (n - 1) : 0;
    const pi = clamp((p - off) / (1 - spread)), qi = clamp((q - off) / (1 - spread));
    let dx = 0, dy = 0, sc = 1, sy = 1, sk = 0, a = A, rot = 0;
    const cx = x0 + M.xs[i] + M.ws[i] / 2;
    if (fin === 'up') dy += (1 - E.o5(pi)) * size * 1.05;
    else if (fin === 'scale') { sc = lerp(1.9, 1, E.o5(pi)); a *= E.o(pi); }
    else if (fin === 'track') { dx += (1 - E.o5(p)) * size * 0.55 * (i - (n - 1) / 2); a *= E.o(pi); }
    else if (fin === 'slide') { dx += (1 - E.o5(pi)) * size * 0.9; a *= E.o(pi); }
    else if (fin === 'tilt') { sy = Math.max(0.001, E.o5(pi)); sk = (1 - E.o5(pi)) * -0.7; a *= clamp(pi * 3); }
    else if (fin === 'impact') { sc = lerp(1.7, 1, E.o5(p)) * (1 + 0.04 * Math.sin(rng(t, it.t0, it.t0 + .6) * Math.PI * 3) * (1 - p)); a *= clamp(p * 4); }
    if (fout === 'up') dy -= E.i(qi) * size * 1.05;
    else if (fout === 'fade') { a *= 1 - E.s(q); dy -= E.s(q) * 18; }
    else if (fout === 'fall' && t > it.t1) {
      const tt = Math.max(0, t - it.t1 - i * 0.045 - hr(i + n) * 0.06);
      dy += 0.5 * 3400 * tt * tt; rot = tt * (hr(i * 3.1) - 0.5) * 7; dx += (hr(i * 5.7) - 0.5) * 260 * tt;
    }
    if (a <= 0.003) continue;
    g.save();
    g.translate(cx + dx, y + dy);
    if (rot) g.rotate(rot);
    if (sc !== 1) g.scale(sc, sc);
    if (sy !== 1 || sk) g.transform(1, 0, sk, sy, 0, 0);
    g.globalAlpha = a;
    if (sh) { g.shadowColor = rgb(P.ink, 0.17 * a); g.shadowBlur = size * 0.16; g.shadowOffsetY = size * 0.06; }
    g.fillStyle = rgb(col);
    g.fillText(ch, -M.ws[i] / 2, 0);
    g.restore();
  }
  if (it.strike) {
    const u = E.io(rng(t, it.strike.t, it.strike.t + 0.35)) * (1 - q);
    if (u > 0) line(g, x0 - size * 0.08, y - size * 0.3, x0 - size * 0.08 + (M.total + size * 0.16) * u, y - size * 0.3, size * 0.07, it.strike.col, 'butt');
  }
  g.restore();
}
/* Строка из нескольких фрагментов разного кегля/начертания с общей базовой линией */
function row(parts, x, y, al = 'l', gap = 0.28) {
  const ws = parts.map(p => textW(p.s, p.f, p.size, p.track || 0));
  const gaps = parts.map(p => p.size * gap);
  let total = ws.reduce((a, b) => a + b, 0) + gaps.slice(1).reduce((a, b) => a + b, 0);
  let cx = al === 'c' ? x - total / 2 : al === 'r' ? x - total : x;
  return parts.map((p, i) => { const o = Object.assign({}, p, { x: cx, y, al: 'l' }); cx += ws[i] + (gaps[i + 1] || 0); return o; });
}

/* =====================================================================
   СЦЕНА A · 0–13.5 · «300 против несметной» → застывший фриз храма
   ===================================================================== */
const camA = {
  x: [[0, -520], [3, 150], [5.8, 700], [7.2, 900], [8.6, 1550], [9.6, 2450], [10.5, 2900], [13.6, 3150]],
  y: [[0, 60], [5.8, 40], [7.2, 80], [8.6, 330], [10.5, 545], [13.6, 565]],
  z: [[0, 280], [3, 120], [5.8, -150], [7.2, -520], [8.6, -2050], [9.6, -3400], [10.5, -4100], [13.6, -4500]],
  r: [[0, -0.012], [3, 0.006], [5.8, 0.02], [8.6, 0.0], [13.6, -0.012]],
  f: 1000, dof: 9
};
let REF = null; // камера в момент «застывания» — для сплющивания глубины в рельеф
const BAND = { x0: -1300, x1: 3100, y0: -330, y1: 470 };
const ROWS = [3900, 3000, 2300, 1800, 1400].map((d, k) => ({ d, Y: [195, 240, 276, 306, 322][k], k }));

function flatLayer(cam, d, fl, fn, opt) {
  const dd = lerp(d, 1000 + (d - 1000) * 0.015, fl);
  const k = (dd - REF.z) / (d - REF.z);
  layer(cam, dd, (g, s) => { g.translate(REF.x, REF.y); g.scale(k, k); g.translate(-REF.x, -REF.y); fn(g, s * k); }, opt);
}
function visRange(cam, d, margin = 300) { const s = F / (d - cam.z); const hw = (W * 0.62) / s + margin; return [cam.x - hw, cam.x + hw]; }

function persianRow(g, cam, R, te, C, s) {
  const [a, b] = visRange(cam, R.d);
  const tone = clamp((R.d - 1400) / 2500) * 0.55;
  const body = C(mix(P.sl, P.bg, tone)), spear = C(mix(mix(P.ink, P.sl, 0.4), P.bg, tone)), shieldc = C(mix(mix(P.sl, P.ink, 0.35), P.bg, tone));
  const sp = 64, x0 = 250 + R.k * 23;
  const i0 = Math.max(0, Math.floor((a - x0) / sp)), i1 = Math.min(400, Math.ceil((b - x0) / sp));
  g.fillStyle = rgb(body); g.beginPath();
  for (let i = i0; i <= i1; i++) {
    const x = x0 + i * sp + (hr(i * 3 + R.k) - .5) * 16, Y = R.Y + (hr(i + R.k * 7) - .5) * 8;
    g.rect(x - 20, Y - 122, 40, 122); g.moveTo(x + 16, Y - 140); g.arc(x, Y - 140, 16, 0, Math.PI * 2);
  }
  g.fill();
  g.fillStyle = rgb(shieldc); g.beginPath();
  for (let i = i0; i <= i1; i++) { if (i % 2) continue; const x = x0 + i * sp + (hr(i * 3 + R.k) - .5) * 16, Y = R.Y + (hr(i + R.k * 7) - .5) * 8; g.rect(x - 30, Y - 110, 26, 84); }
  g.fill();
  g.strokeStyle = rgb(spear); g.lineWidth = 5; g.beginPath();
  const tips = [];
  for (let i = i0; i <= i1; i++) {
    const x = x0 + i * sp + (hr(i * 3 + R.k) - .5) * 16 + 22, Y = R.Y + (hr(i + R.k * 7) - .5) * 8;
    const sw = Math.sin(te * 1.7 + i * 0.63 + R.k) * 7;
    g.moveTo(x, Y - 30); g.lineTo(x + sw, Y - 320); tips.push([x + sw, Y - 320]);
  }
  g.stroke();
  g.fillStyle = rgb(spear); g.beginPath();
  for (const [x, y] of tips) { g.moveTo(x - 9, y + 4); g.lineTo(x, y - 30); g.lineTo(x + 9, y + 4); g.closePath(); }
  g.fill();
}
function hoplite(g, x, Y, C, te, i) {
  const bob = Math.sin(te * 2.6 + i * 1.3) * 3;
  const y = Y + bob;
  // тень контакта
  g.fillStyle = rgb(P.ink, 0.13); g.beginPath(); g.ellipse(x + 10, Y + 4, 90, 14, 0, 0, Math.PI * 2); g.fill();
  // копьё вперёд-вверх
  line(g, x - 70, y - 20, x + 300, y - 330 + Math.sin(te * 1.3 + i) * 4, 9, C(P.ink));
  poly(g, [[x + 286, y - 318], [x + 330, y - 362], [x + 304, y - 300]], C(P.ink));
  // ноги
  rect(g, x - 34, y - 110, 22, 110, C(P.ink)); rect(g, x + 14, y - 110, 22, 110, C(P.ink));
  // шлем с гребнем
  circ(g, x, y - 300, 44, C(P.och));
  g.fillStyle = rgb(C(P.ink)); g.beginPath(); g.ellipse(x - 6, y - 344, 60, 24, 0, Math.PI, Math.PI * 2); g.fill();
  rect(g, x - 5, y - 306, 10, 40, C(P.ink)); rect(g, x - 26, y - 312, 52, 10, C(P.ink));
  // щит-гоплон
  shadow(g, 1, 0.8, 0.15);
  circ(g, x, y - 170, 100, C(P.och)); noShadow(g);
  circ(g, x, y - 170, 86, C(P.red));
  g.strokeStyle = rgb(C(P.ink)); g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x - 34, y - 132); g.lineTo(x, y - 214); g.lineTo(x + 34, y - 132); g.stroke();
}
function columnShape(g, cx, top, bot, w, cl, cd, cs) {
  const tw = w * 0.86;
  poly(g, [[cx - tw / 2, top + 70], [cx + tw / 2, top + 70], [cx + w / 2, bot], [cx - w / 2, bot]], cl);
  for (let k = 1; k < 5; k++) { const u = k / 5; line(g, cx - tw / 2 + tw * u, top + 90, cx - w / 2 + w * u, bot - 10, 7, cd, 'butt'); }
  poly(g, [[cx - w * 0.62, top + 30], [cx + w * 0.62, top + 30], [cx + tw / 2, top + 72], [cx - tw / 2, top + 72]], cs);
  rect(g, cx - w * 0.72, top, w * 1.44, 32, cl);
}
function sceneA(t, cam) {
  const fz = E.io(rng(t, 7.2, 8.1));
  const fl = E.io(rng(t, 7.35, 8.9));
  const ck = E.io(rng(t, 7.35, 8.6));
  const te = t < 7.2 ? t : 7.2 + (1 - Math.exp(-(t - 7.2) * 7)) / 7;
  const C = c => stone(c, fz);
  G.setTransform(1, 0, 0, 1, 0, 0); G.fillStyle = rgb(P.bg); G.fillRect(0, 0, W, H);
  // маска фриза в мировых координатах d=1000 → экран
  let clip = null;
  if (ck > 0) {
    const ex = (1 - ck) * 9000;
    const r = { x0: BAND.x0 - ex, x1: BAND.x1 + ex, y0: BAND.y0 - ex, y1: BAND.y1 + ex };
    clip = [toScreen(cam, 1000, r.x0, r.y0), toScreen(cam, 1000, r.x1, r.y0), toScreen(cam, 1000, r.x1, r.y1), toScreen(cam, 1000, r.x0, r.y1)];
  }
  const o = { clip };
  if (ck > 0) { // фон рельефа
    layer(cam, 1000, g => rect(g, BAND.x0, BAND.y0, BAND.x1 - BAND.x0, BAND.y1 - BAND.y0, C(P.bg)), { blur: 0 });
  }
  // солнце и горы
  flatLayer(cam, 6000, fl, g => circ(g, 3200, -1700, 950, C(mix(P.bg, P.och, 0.5))), o);
  flatLayer(cam, 4500, fl, g => {
    const c = C(mix(P.bg, P.sl, 0.28));
