<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Спарта — завоевание и три сословия</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="geo.js"></script>
<style>
  html,body{margin:0;background:#15181f;color:#FBF7EE;font:14px Inter,system-ui,sans-serif}
  canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#FBF7EE}
  #ui{display:flex;gap:10px;align-items:center;padding:8px 16px}

</style>

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="pp">▶︎ / ❚❚</button><input id="sc" type="range" min="0" max="43.2" step="0.0166667" value="0"><span id="tm">0.00</span></div>
<audio id="au" src="audio/mix.wav" preload="auto"></audio>
<script>
'use strict';
/* =====================================================================
   Спарта: завоевание и три сословия. Детерминированный таймлайн renderAt(t).
   2.5D-камера: масштаб слоя = F/(d - cam.z) → параллакс планов.
   Стиль: плоские формы с чернильным контуром, стикмены (большая белая голова).
   ===================================================================== */
const W = 1920, H = 1080, FPS = 60, DUR = 43.2, F = 1000, TAU = Math.PI * 2;
const SUB = 3, SHUTTER = 0.3;
const P = {
  sand: [227, 199, 147], terra: [198, 106, 67], sky: [169, 207, 224], olive: [143, 156, 104],
  stone: [185, 170, 146], ink: [35, 36, 43], paper: [251, 247, 238]
};
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const rng = (t, a, b) => clamp((t - a) / (b - a));
const hr = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const E = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  s: t => -(Math.cos(Math.PI * t) - 1) / 2,
  o: t => 1 - Math.pow(1 - t, 3),
  o5: t => 1 - Math.pow(1 - t, 5),
  i: t => t * t * t,
  i2: t => t * t,
  ob: t => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
function spl(t, k) {
  const n = k.length;
  if (t <= k[0][0]) return k[0][1];
  if (t >= k[n - 1][0]) return k[n - 1][1];
  let i = 0; while (t > k[i + 1][0]) i++;
  const [t0, v0] = k[i], [t1, v1] = k[i + 1];
  const m = j => (j <= 0 || j >= n - 1) ? 0 : (k[j + 1][1] - k[j - 1][1]) / (k[j + 1][0] - k[j - 1][0]);
  const h = t1 - t0, u = (t - t0) / h, u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * v0 + (u3 - 2 * u2 + u) * h * m(i) + (-2 * u3 + 3 * u2) * v1 + (u3 - u2) * h * m(i + 1);
}
const camOf = (K, t) => ({ x: spl(t, K.x), y: spl(t, K.y), z: spl(t, K.z), rot: spl(t, K.r), f: K.f || 1000, dof: K.dof || 9 });

/* ---------- холсты и слои ---------- */
const cv = document.getElementById('c'), main = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const frC = mk(), fr = frC.getContext('2d');
const s1C = mk(), s1 = s1C.getContext('2d');
const s2C = mk(), s2 = s2C.getContext('2d');
const offC = mk(), og = offC.getContext('2d');
let G = fr, CUR_S = 1;
function proj(g, cam, d) {
  const s = F / (d - cam.z);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.translate(W / 2, H / 2); g.rotate(cam.rot); g.scale(s, s); g.translate(-cam.x, -cam.y);
  return s;
}
function layer(cam, d, fn, opt = {}) {
  const dz = d - cam.z; if (dz < 30) return;
  const s = F / dz; CUR_S = s;
  let b = opt.blur != null ? opt.blur : Math.min(16, Math.abs(F / dz - F / (cam.f - cam.z)) * cam.dof);
  b += opt.addBlur || 0;
  const a = opt.alpha == null ? 1 : opt.alpha;
  if (a <= 0.002) return;
  if (b < 0.6 && a >= 1) { G.save(); proj(G, cam, d); fn(G, s); G.restore(); return; }
  og.setTransform(1, 0, 0, 1, 0, 0); og.clearRect(0, 0, W, H);
  og.save(); proj(og, cam, d); fn(og, s); og.restore();
  G.save(); G.setTransform(1, 0, 0, 1, 0, 0);
  if (b >= 0.6) G.filter = `blur(${b.toFixed(2)}px)`;
  G.globalAlpha = a; G.drawImage(offC, 0, 0); G.restore();
}
/* ---------- примитивы с чернильным контуром ---------- */
const LW = 5.5;
function ink(g, lw = LW) { g.lineWidth = Math.max(lw, 2.4 / CUR_S); g.strokeStyle = rgb(P.ink); g.lineJoin = 'round'; g.lineCap = 'round'; }
function fillStroke(g, col, lw = LW) { g.fillStyle = rgb(col); g.fill(); ink(g, lw); g.stroke(); }
function pathPoly(g, pts, close = true) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); if (close) g.closePath(); }
function smoothPath(g, pts, close = true) {
  const n = pts.length; g.beginPath();
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (close) {
    const m0 = mid(pts[n - 1], pts[0]); g.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) { const p = pts[i], m = mid(p, pts[(i + 1) % n]); g.quadraticCurveTo(p[0], p[1], m[0], m[1]); }
    g.closePath();
  } else {
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n - 1; i++) { const m = mid(pts[i], pts[i + 1]); g.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
    g.lineTo(pts[n - 1][0], pts[n - 1][1]);
  }
}
function circle(g, x, y, r, col, lw = LW) { g.beginPath(); g.arc(x, y, Math.max(0.01, r), 0, TAU); fillStroke(g, col, lw); }
function line(g, x1, y1, x2, y2, w, c = P.ink) { g.strokeStyle = rgb(c); g.lineWidth = Math.max(w, 2.2 / CUR_S); g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function softShadow(g, x, y, rx, ry, a = 0.15) { g.save(); g.filter = 'blur(6px)'; g.fillStyle = rgb(P.ink, a); g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill(); g.restore(); }
function cloud(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(-160, 30);
  g.bezierCurveTo(-170, -10, -120, -30, -90, -12); g.bezierCurveTo(-80, -60, -10, -66, 10, -26);
  g.bezierCurveTo(30, -56, 100, -50, 100, -10); g.bezierCurveTo(140, -16, 170, 10, 160, 30); g.closePath();
  fillStroke(g, mix(P.paper, P.sky, 0.25), 5); g.restore();
}
function hillRange(g, pts, col, base = 4000) {
  const P2 = [[pts[0][0], base], ...pts, [pts[pts.length - 1][0], base]];
  smoothPath(g, P2, false); g.closePath(); fillStroke(g, col);
}
function rock(g, x, y, s, col = P.stone) {
  g.save(); g.translate(x, y); g.scale(s, s);
  smoothPath(g, [[-60, 0], [-50, -40], [-10, -58], [40, -44], [62, -10], [60, 0]], true); fillStroke(g, col); g.restore();
}
function pot(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(-26, -150); g.lineTo(26, -150); g.bezierCurveTo(30, -130, 70, -110, 66, -60);
  g.bezierCurveTo(62, -20, 40, 0, 24, 0); g.lineTo(-24, 0); g.bezierCurveTo(-40, 0, -62, -20, -66, -60);
  g.bezierCurveTo(-70, -110, -30, -130, -26, -150); g.closePath(); fillStroke(g, P.terra);
  g.beginPath(); g.ellipse(0, -150, 34, 9, 0, 0, TAU); fillStroke(g, mix(P.terra, P.ink, 0.35)); g.restore();
}
function hut(g, x, y, w, h, col = P.stone) {
  pathPoly(g, [[x - w / 2, y], [x - w / 2, y - h], [x + w / 2, y - h], [x + w / 2, y]]); fillStroke(g, col);
  pathPoly(g, [[x - w / 2 - 14, y - h], [x + w / 2 + 14, y - h], [x + w / 2 + 14, y - h - 22], [x - w / 2 - 14, y - h - 22]]); fillStroke(g, mix(col, P.ink, 0.12));
  pathPoly(g, [[x - 22, y], [x - 22, y - 70], [x + 22, y - 70], [x + 22, y]]); fillStroke(g, mix(P.ink, P.stone, 0.35));
}
function oliveTree(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  pathPoly(g, [[-10, 0], [-8, -90], [-30, -130], [-18, -134], [0, -104], [16, -140], [28, -134], [10, -90], [12, 0]]); fillStroke(g, mix(P.stone, P.ink, 0.35));
  smoothPath(g, [[-110, -150], [-90, -220], [-20, -250], [60, -235], [110, -180], [90, -130], [-60, -120]], true); fillStroke(g, P.olive);
  g.restore();
}
function cypress(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  line(g, 0, 0, 0, -40, 12, mix(P.stone, P.ink, 0.4));
  smoothPath(g, [[0, -360], [36, -200], [30, -60], [-30, -60], [-36, -200]], true); fillStroke(g, mix(P.olive, P.ink, 0.3)); g.restore();
}

/* =====================================================================
   ПЕРСОНАЖ-СТИКМЕН
   o: x,y (стопы), s, dir, tunic, zig, hair, helmet, helmDrop, cloak, item, itemS,
      walk, ph, crouch, tilt, bow, aF/aB {a,e}, mouth, brow, look, lookY
   ===================================================================== */
function ik(hx, hy, fx, fy, L1, L2, dir) {
  const dx = fx - hx, dy = fy - hy; let d = Math.hypot(dx, dy); d = Math.min(Math.max(d, 1), L1 + L2 - 0.01);
  const a = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  const k = Math.atan2(dy, dx) - dir * a;
  return [hx + Math.cos(k) * L1, hy + Math.sin(k) * L1];
}
function armPts(sx, sy, A, dir) {
  const a = A.a, e = A.e || 0;
  const ex = sx + dir * Math.sin(a) * 44, ey = sy + Math.cos(a) * 44;
  const hx = ex + dir * Math.sin(a + e) * 42, hy = ey + Math.cos(a + e) * 42;
  return [ex, ey, hx, hy, a + e];
}
function drawItem(g, it, s, hx, hy, ang, dir, t) {
  if (!it || s <= 0.01) return;
  g.save(); g.translate(hx, hy); g.scale(s, s);
  if (it === 'spear') {
    line(g, 0, 70, 0, -230, 6);
    pathPoly(g, [[0, -270], [11, -236], [0, -222], [-11, -236]]); fillStroke(g, P.stone, 4);
  } else if (it === 'spearFwd') {
    g.rotate(dir * 1.15); line(g, 0, 90, 0, -210, 6);
    pathPoly(g, [[0, -250], [11, -216], [0, -202], [-11, -216]]); fillStroke(g, P.stone, 4);
  } else if (it === 'hammer') {
    const vx = dir * Math.sin(ang), vy = Math.cos(ang);
    line(g, 0, 0, vx * 52, vy * 52, 7, mix(P.stone, P.ink, 0.45));
    g.save(); g.translate(vx * 56, vy * 56); g.rotate(Math.atan2(vy, vx));
    pathPoly(g, [[-12, -22], [12, -22], [12, 22], [-12, 22]]); fillStroke(g, mix(P.stone, P.ink, 0.15), 4); g.restore();
  } else if (it === 'amphora') {
    g.translate(0, 8); g.scale(0.5, 0.5); g.translate(0, 150); pot(g, 0, 0, 1);
  } else if (it === 'basket') {
    g.beginPath(); g.moveTo(-34, 6); g.lineTo(34, 6); g.lineTo(26, 46); g.lineTo(-26, 46); g.closePath(); fillStroke(g, mix(P.sand, P.ink, 0.12), 4);
    circle(g, -10, 2, 10, P.olive, 3); circle(g, 10, 0, 10, P.olive, 3);
  }
  g.restore();
}
function helmet(g, hy, dir, drop = 0, sc = 1) {
  if (sc <= 0.01) return;
  g.save(); g.translate(0, hy - drop); g.scale(sc, sc);
  g.beginPath(); g.ellipse(-dir * 6, -36, 36, 24, 0, Math.PI, TAU); g.closePath(); fillStroke(g, P.terra);
  g.beginPath(); g.moveTo(-dir * 42, -12);
  if (dir > 0) g.arc(0, -12, 42, Math.PI, TAU, false); else g.arc(0, -12, 42, 0, -Math.PI, true);
  g.lineTo(dir * 42, 18); g.lineTo(dir * 31, 18); g.lineTo(dir * 31, -12); g.closePath();
  fillStroke(g, mix(P.stone, P.ink, 0.12));
  g.restore();
}
function face(g, hy, dir, o) {
  const ex = dir * 7 + (o.look || 0) * 6, ey = hy - 2 + (o.lookY || 0) * 5;
  g.fillStyle = rgb(P.ink);
  for (const k of [-1, 1]) { g.beginPath(); g.arc(ex + k * 13, ey, Math.max(5.2, 1.6 / CUR_S), 0, TAU); g.fill(); }
  if (o.brow) {
    const b = o.brow;
    line(g, ex - 20, ey - 14 + b * 2, ex - 7, ey - 14 - b * 4, 4); line(g, ex + 7, ey - 14 - b * 4, ex + 20, ey - 14 + b * 2, 4);
  }
  const mx = ex, my = ey + 20; ink(g, 4);
  const m = o.mouth || 'n';
  g.beginPath();
  if (m === 'n') { g.moveTo(mx - 8, my); g.lineTo(mx + 8, my); }
  else if (m === 'smile') { g.arc(mx, my - 6, 10, 0.35, Math.PI - 0.35); }
  else if (m === 'sad') { g.arc(mx, my + 8, 9, Math.PI + 0.45, TAU - 0.45); }
  else if (m === 'o') { g.arc(mx, my + 1, 5, 0, TAU); }
  else if (m === 'strain') { g.moveTo(mx - 11, my); for (let k = 0; k < 4; k++) g.lineTo(mx - 11 + (k + 1) * 5.5, my + (k % 2 ? 3 : -3)); }
  g.stroke();
}
function person(g, o, t = 0) {
  const dir = o.dir || 1, amp = o.walk || 0, ph = o.ph || 0, cr = o.crouch || 0;
  g.save(); g.translate(o.x, o.y); g.scale(o.s || 1, o.s || 1);
  if (!o.noShadow) softShadow(g, 0, 2, 46, 8, 0.16);
  const bob = -Math.abs(Math.sin(ph)) * 5 * amp;
  const hipY = -74 + cr * 34 + bob;
  const f1x = dir * (10 + 30 * Math.sin(ph) * amp + cr * 16), f1y = -Math.max(0, Math.cos(ph)) * 16 * amp;
  const f2x = dir * (-10 - 30 * Math.sin(ph) * amp - cr * 8), f2y = -Math.max(0, -Math.cos(ph)) * 16 * amp;
  const legC = P.ink;
  for (const [fx, fy, hx] of [[f2x, f2y, -4], [f1x, f1y, 4]]) {
    const [kx, ky] = ik(hx, hipY, fx, fy, 38, 38, dir);
    ink(g, 6.5); g.strokeStyle = rgb(legC);
    g.beginPath(); g.moveTo(hx, hipY); g.lineTo(kx, ky); g.lineTo(fx, fy); g.lineTo(fx + dir * 11, fy); g.stroke();
  }
  const tilt = o.tilt || 0;
  g.save(); g.translate(0, hipY); g.rotate(tilt * dir);
  const shY = -80, bowX = dir * (o.bow || 0) * 16, bowY = (o.bow || 0) * 12;
  if (o.cloak) {
    const wv = Math.sin(t * 3 + (o.x || 0) * 0.01) * 5;
    pathPoly(g, [[-dir * 8, shY + 4], [dir * 14, shY + 4], [-dir * (26 + wv), 30], [-dir * (52 + wv), 24]]); fillStroke(g, o.cloak);
  }
  const aB = o.aB || { a: 0.15 - Math.sin(ph) * 0.55 * amp, e: 0.25 };
  const aF = o.aF || { a: 0.15 + Math.sin(ph) * 0.55 * amp, e: 0.25 };
  const [bex, bey, bhx, bhy] = armPts(-dir * 6, shY + 12, aB, dir);
  ink(g, 6); g.beginPath(); g.moveTo(-dir * 6, shY + 12); g.lineTo(bex, bey); g.lineTo(bhx, bhy); g.stroke();
  // туника
  g.beginPath(); g.moveTo(-23, shY); g.lineTo(23, shY); g.lineTo(36, 18);
  if (o.zig) { for (let k = 1; k <= 6; k++) g.lineTo(36 - k * 12, 18 + (k % 2 ? 9 : 0)); } else g.lineTo(-36, 18);
  g.closePath(); fillStroke(g, o.tunic || P.stone);
  line(g, -27, -8, 27, -8, 4, mix(P.ink, P.stone, 0.3));
  // голова
  const hy = shY - 40 + bowY, hx0 = bowX;
  g.save(); g.translate(hx0, 0);
  if (o.hair) {
    g.save(); g.scale(dir, 1); g.beginPath(); g.moveTo(0, hy);
    const seed = (o.x0 || 0) * 0.013;
    for (let k = 0; k <= 18; k++) { const a = Math.PI * 0.7 + k / 18 * Math.PI * 1.3, r = 41 + (k % 2 ? 6 : 12 + hr(k + seed) * 6); g.lineTo(Math.cos(a) * r - 4, hy + Math.sin(a) * r); }
    g.closePath(); fillStroke(g, mix(P.ink, P.terra, 0.38)); g.restore();
  }
  circle(g, 0, hy, 38, P.paper);
  face(g, hy, dir, o);
  if (o.helmet) helmet(g, hy, dir, o.helmDrop || 0, o.helmS == null ? 1 : o.helmS);
  g.restore();
  // передняя рука и предмет
  const [fex, fey, fhx, fhy, fang] = armPts(dir * 6, shY + 12, aF, dir);
  ink(g, 6); g.beginPath(); g.moveTo(dir * 6, shY + 12); g.lineTo(fex, fey); g.lineTo(fhx, fhy); g.stroke();
  drawItem(g, o.item, o.itemS == null ? 1 : o.itemS, fhx, fhy, fang, dir, t);
  g.restore();
  g.restore();
}
function bubble(g, x, y, s, txt = '!') {
  if (s <= 0.01) return;
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.ellipse(0, 0, 62, 46, 0, 0, TAU); g.moveTo(-26, 36); g.lineTo(-44, 74); g.lineTo(-4, 42);
  fillStroke(g, P.paper);
  g.beginPath(); g.ellipse(0, 0, 62, 46, 0, 0.9, 2.1); g.fillStyle = rgb(P.paper); g.fill();
  g.fillStyle = rgb(P.terra); g.font = '700 64px Oswald'; g.textAlign = 'center'; g.fillText(txt, 0, 23);
  g.restore();
}

/* =====================================================================
   ТИПОГРАФИКА (как в первом ролике серии)
   ===================================================================== */
const FONTS = { O7: s => `700 ${s}px Oswald`, O4: s => `400 ${s}px Oswald`, P9: s => `900 ${s}px "Playfair Display"`, Pi: s => `italic 700 ${s}px "Playfair Display"` };
const mcache = {};
function charXs(str, f, size, track) {
  const key = str + '|' + f + '|' + size + '|' + track;
  if (mcache[key]) return mcache[key];
  fr.save(); fr.font = FONTS[f](size);
  const xs = [], ws = [];
  for (let i = 0; i < str.length; i++) { xs.push(fr.measureText(str.slice(0, i)).width + i * track * size); ws.push(fr.measureText(str[i]).width); }
  const total = fr.measureText(str).width + (str.length - 1) * track * size;
  fr.restore();
  return (mcache[key] = { xs, ws, total });
}
const textW = (str, f, size, track = 0) => charXs(str, f, size, track).total;
function drawText(it, t, cam) {
  const din = it.din || 0.7, dout = it.dout || 0.45;
  if (t < it.t0 || t > it.t1 + dout) return;
  const p = rng(t, it.t0, it.t0 + din), q = rng(t, it.t1, it.t1 + dout);
  const g = G; g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  const drift = (it.vx == null ? -8 : it.vx) * (t - it.t0);
  g.translate(W / 2, H / 2); g.rotate((cam ? cam.rot : 0) * 0.45); g.translate(-W / 2 + drift, -H / 2);
  let x = it.x, y = it.y, size = it.size, track = it.track || 0;
  if (it.trackTo != null) track = lerp(track, it.trackTo, E.s(rng(t, it.t0, it.t1 + dout)));
  const fin = it.fin || 'up', fout = it.fout || 'up';
  const M = charXs(it.s, it.f, size, track);
  const n = it.s.length, spread = it.spread == null ? 0.35 : it.spread;
  const x0 = it.al === 'c' ? x - M.total / 2 : it.al === 'r' ? x - M.total : x;
  const col = typeof it.col === 'function' ? it.col(t) : it.col;
